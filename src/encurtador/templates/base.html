<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Encurtador de URLs{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    input { width: 100%; padding: .4rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .4rem 1rem; }
    .erro { color: #b00020; }
    .ajuda { display: block; margin-top: .3rem; color: #555; }
    .resultado { background: #eef6ee; padding: 1rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1><a href="/">Encurtador de URLs</a></h1>
  {% block conteudo %}{% endblock %}
</body>
</html>
